# Root Alembic config — migrations live in src/storage/migrations
[alembic]
script_location = src/storage/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg2://spellgrammar_user:spellgrammar_pass@localhost:5432/spell_grammar_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
