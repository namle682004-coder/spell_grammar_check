# Config for prompting evaluation
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: false
  device_map: "auto"

inference:
  batch_size: 1
  max_new_tokens: 128
  temperature: 0.1
  do_sample: false
  top_p: 0.95

prompt:
  template: "simple" # Options: simple, few_shot, english

data:
  test_path: "data/test_samples.json"

output:
  dir: "outputs/prompting_results"
  save_predictions: true

seed: 42
