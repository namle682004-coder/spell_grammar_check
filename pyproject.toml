[project]
name = "grammar-correction"
version = "0.1.0"
description = "Grammar and spelling correction with LLM"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"},
]

requires-python = ">=3.10"

dependencies = [
    # core
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "typer>=0.12.0",

    # huggingface
    "huggingface-hub>=0.23.0",
    "datasets>=2.19.0",
    "transformers>=4.41.0",
    "tokenizers>=0.19.0",
    "wandb>=0.17.0",

    # training
    "torch>=2.3.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "bitsandbytes>=0.43.0",

    # unsloth
    "unsloth[colab-new]>=2024.6",

    # inference / deploy
    "vllm>=0.5.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",

    # eval
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "nltk>=3.8.0",

    # utils
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",

    # database
    "alembic>=1.7.0",
    "psycopg2-binary>=2.9.0",

    # api auth & monitoring
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "notebook>=7.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "pre-commit>=4.4.0",
    "black>=24.3.0",
    "coverage>=7.4.0",
]

[project.urls]
homepage = "https://github.com/yourusername/grammar-correction"
repository = "https://github.com/yourusername/grammar-correction"
documentation = "https://github.com/yourusername/grammar-correction#readme"

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "E741", "E712", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
